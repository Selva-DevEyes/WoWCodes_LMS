# Render Blueprint Configuration for WoWCodes LMS
services:
  # FastAPI Backend Web Service
  - type: web
    name: wowcodes-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wowcodes-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production

  # React 19 Frontend Web Service (Static Site)
  - type: web
    name: wowcodes-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Render Managed PostgreSQL Database
databases:
  - name: wowcodes-db
    databaseName: wowcodes
    user: wowcodes_user
    plan: free
