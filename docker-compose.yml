version: "3.9"

services:
  backend:
    build: ./backend
    container_name: wowcodes-backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=sqlite:///./wowcodes.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: wowcodes-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api/v1
      - VITE_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
